<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Finanzas Alejandro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
            padding: 24px;
        }

        h1,
        h2 {
            text-align: center;
            color: #2d3748;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            margin-bottom: 32px;
        }

        form input,
        form select,
        form button {
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
        }

        form button {
            background: #3182ce;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        form button:hover {
            background: #2563eb;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .dashboard-canvas {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1 / 1;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            display: block;
            margin: 0 auto;
            padding: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
        }

        th {
            background: #3182ce;
            color: #fff;
        }

        tr:last-child td {
            border-bottom: none;
        }

        @media (max-width: 700px) {
            .container {
                padding: 8px;
            }

            .dashboard {
                flex-direction: column;
                gap: 16px;
            }

            .dashboard-canvas {
                max-width: 100%;
            }

            form {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>

<body>
    <div style="position:fixed;top:20px;right:30px;z-index:1000;">
        <button id="btnModoOscuro">🌙 Modo oscuro</button>
    </div>
    <div class="container">
        <h1>Finanzas App</h1>
        <form id="formTransaccion">
            <select id="tipo" required>
                <option value="">Tipo</option>
                <option value="ingreso">Ingreso</option>
                <option value="gasto">Gasto</option>
            </select>
            <input type="number" id="monto" placeholder="Monto" required min="0" step="0.01">
            <input type="date" id="fecha" required>
            <input type="text" id="descripcion" placeholder="Descripción">
            <button type="submit">Agregar</button>
        </form>

        <h2>Dashboard</h2>
        <div class="dashboard">
            <canvas id="graficoIngresosGastos" class="dashboard-canvas"></canvas>
        </div>

        <div style="text-align:center; margin:20px 0;">
            <button id="btnResumen" style="margin:10px;">Ver resumen mensual (Bs)</button>
            <label for="valorDolar"><b>Valor del dólar (Bs):</b></label>
            <input type="number" id="valorDolar" min="0" step="0.01" style="width:100px;">
            <button id="btnResumenDolar">Ver resumen mensual en dólares</button>
        </div>
        <div id="resumenMensual"
            style="max-width:600px;margin:20px auto;padding:16px;background:#e6f7ff;border-radius:8px;display:none;">
        </div>
        <div id="resumenMensualDolar"
            style="max-width:600px;margin:20px auto;padding:16px;background:#fffbe6;border-radius:8px;display:none;">
        </div>

        <h2>Historial</h2>
        <table id="tablaHistorial">
            <thead>
                <tr>
                    <th>Tipo</th>
                    <th>Monto</th>
                    <th>Fecha</th>
                    <th>Descripción</th>
                    <th>Eliminar</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se renderiza el historial -->
            </tbody>
        </table>
    </div>
    <script src="main.js"></script>
</body>

</html>
